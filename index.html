<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>QUANTO TÁ</title>
<meta name="description" content="Preços da cesta básica no Pão de Açúcar (São Paulo), registrados toda semana com as mesmas marcas.">
<meta name="theme-color" content="#f3f5f2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#121614" media="(prefers-color-scheme: dark)">
<link rel="icon" type="image/png" href="logo.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-title" content="QUANTO TÁ">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<meta property="og:title" content="QUANTO TÁ">
<meta property="og:description" content="Quanto custa a cesta básica esta semana: arroz, feijão, ovos, leite, óleo e acém.">
<meta property="og:image" content="icons/icon-512.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,800&family=IBM+Plex+Sans:wght@400;600&display=swap">
<script>
  // Aberto pelo ícone da Tela de Início: vai direto para os preços.
  var DESTINO = "https://claude.ai/artifact/KE5NcjBfNcqnfnozBojvhG";
  var standalone = window.navigator.standalone === true ||
    (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches);
  if (standalone) location.replace(DESTINO);
</script>
<style>
:root{--bg:#f3f5f2;--surface:#ffffff;--ink:#18201b;--muted:#5d6a62;--line:#dde3dd;--accent:#1f6b4a;
  --display:"Bricolage Grotesque",ui-sans-serif,system-ui,sans-serif;--body:"IBM Plex Sans",ui-sans-serif,system-ui,sans-serif;
  padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#121614;--surface:#1a201d;--ink:#e6ece8;--muted:#9aa8a0;--line:#2a332e;--accent:#5fc48f;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.5;padding-inline:16px}
main{width:100%;max-width:420px;display:flex;flex-direction:column;align-items:center;gap:18px;text-align:center;padding-block:40px}
.logo{width:96px;height:96px;border-radius:22%}
h1{font-family:var(--display);font-weight:800;font-size:2.6rem;line-height:1;margin:0;letter-spacing:-.02em}
p{margin:0;color:var(--muted)}
.itens{font-size:.88rem}
.go{display:block;width:100%;background:var(--accent);color:#fff;text-decoration:none;font-weight:600;font-size:1.05rem;padding:15px 20px;border-radius:10px}
.go:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.dica{font-size:.88rem;border:1.5px dashed var(--line);border-radius:10px;padding:12px 14px;background:var(--surface)}
.dica b{color:var(--ink)}
</style>
</head>
<body>
<main>
  <img class="logo" src="logo.png" alt="" width="96" height="96">
  <h1>QUANTO TÁ</h1>
  <p>Quanto custa a cesta básica no Pão de Açúcar (São Paulo), registrada toda segunda-feira com as mesmas marcas.</p>
  <p class="itens">Arroz · feijão · ovos · leite · óleo · acém</p>
  <a class="go" href="https://claude.ai/artifact/KE5NcjBfNcqnfnozBojvhG">Ver preços desta semana</a>
  <p class="dica">No iPhone: toque em <b>Compartilhar</b> e depois em <b>Adicionar à Tela de Início</b>. O ícone abre os preços direto.</p>
</main>
</body>
</html>
